<!--
  Emailing Prospection — Grist
  Prospection ESN conseils départementaux : liste de contacts, modèles d'email, envoi via n8n
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Emailing Prospection</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #F6F7F9;
      --color-primary: #20252B;
      --color-accent: #2563EB;
      --color-brand-teal: #3FEAC5;
      --color-brand-coral: #F58C69;
      --color-brand-ink: #173B43;
      --color-green: #16B378;
      --color-orange: #F0AD4E;
      --color-red: #D9534F;
      --color-text-muted: #6B7280;
      --color-border: #E2E4EC;
      --radius: 8px;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-bg);
      color: var(--color-primary);
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
    }
    .hidden { display: none !important; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea {
      font-family: inherit; font-size: 14px; color: var(--color-primary);
      background-color: #fff; color-scheme: light;
    }
    select option { color: #20252B; background: #fff; }
    input::placeholder, textarea::placeholder { color: #8A919C; opacity: 1; }

    #not-in-grist { padding: 40px; text-align: center; color: var(--color-text-muted); }

    #main-content { display: flex; flex-direction: column; height: 100vh; }

    /* ===== TABS ===== */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 3px solid var(--color-brand-teal); background: #fff;
      flex-wrap: wrap; gap: 10px; flex-shrink: 0;
    }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-logo { width:112px; height:42px; object-fit:contain; object-position:left center; flex-shrink:0; }
    .app-header h1 { font-size:16px; font-weight:700; }
    .app-subtitle { font-size:11px; color:var(--color-text-muted); }
    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      border: none; background: transparent; padding: 8px 14px; border-radius: 8px;
      font-weight: 600; color: var(--color-text-muted);
    }
    .tab-btn:hover { background:#EEFFFB; color:var(--color-brand-ink); }
    .tab-btn.active { background: var(--color-brand-ink); color: #fff; box-shadow:inset 0 -3px 0 var(--color-brand-coral); }
    .tab-panel {
      padding: 16px 20px; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }

    /* ===== TOOLBAR / FILTERS ===== */
    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; flex-shrink: 0;
    }
    .toolbar select, .toolbar input[type="text"] {
      padding: 7px 10px; border: 1px solid var(--color-border); border-radius: 8px; background: #fff; color:#20252B;
    }
    .toolbar select:focus, .toolbar input[type="text"]:focus { outline:none; border-color:#18A98B; box-shadow:0 0 0 3px rgba(63,234,197,.20); }
    .spacer { flex: 1; }
    .btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--color-border);
      background: #fff; font-weight: 600; color: var(--color-primary);
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .btn-danger { background: var(--color-red); color: #fff; border-color: var(--color-red); }
    .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 6px; }

    .selection-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: #EEFFFB; border: 1px solid #AEEEDD; border-left:4px solid var(--color-brand-teal); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
      flex-shrink: 0;
    }
    .overview-grid { display:grid; grid-template-columns:repeat(5,minmax(110px,1fr)); gap:10px; margin-bottom:14px; }
    .metric { position:relative; overflow:hidden; background:#fff; border:1px solid var(--color-border); border-radius:8px; padding:11px 12px 11px 15px; min-height:68px; text-align:left; }
    .metric::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:#A8B0BA; }
    button.metric { cursor:pointer; font:inherit; color:inherit; }
    button.metric:hover, button.metric.active { border-color:#18A98B; box-shadow:0 0 0 2px rgba(63,234,197,.18); transform:translateY(-1px); }
    .metric-draft::before { background:var(--color-brand-coral); }
    .metric-queue::before, .metric-relaunch::before { background:var(--color-brand-teal); }
    .metric-attention::before { background:#E5A43B; }
    .metric-sent::before { background:#5B7C99; }
    .metric-draft .metric-value { color:#B94F2D; }
    .metric-queue .metric-value, .metric-relaunch .metric-value { color:#137B70; }
    .metric-attention .metric-value { color:#9A650D; }
    .metric-sent .metric-value { color:#456A89; }
    .metric-value { font-size:22px; line-height:1.1; font-weight:700; color:var(--color-primary); }
    .metric-label { color:var(--color-text-muted); font-size:12px; margin-top:5px; }
    .workflow-strip { display:flex; align-items:center; gap:8px; padding:10px 12px; margin-bottom:12px; background:#fff; border:1px solid #CDEDE6; border-radius:8px; overflow-x:auto; }
    .workflow-step { display:flex; align-items:center; gap:6px; white-space:nowrap; color:var(--color-text-muted); font-size:12px; }
    .workflow-step strong { color:var(--color-primary); }
    .workflow-step svg { color:#10987D; }
    .workflow-step:nth-of-type(even) svg { color:#C85E3A; }
    .workflow-arrow { color:#A0A6B0; }
    .search-field { min-width:220px; flex:1; max-width:360px; }
    .state-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
    .btn-icon { width:34px; height:34px; padding:0; display:inline-grid; place-items:center; }
    .btn svg { width:17px; height:17px; stroke-width:2; }
    .segmented { display:grid; grid-template-columns:1fr 1fr; padding:3px; background:#EEF0F3; border-radius:8px; gap:3px; }
    .segmented button { border:0; background:transparent; padding:9px; border-radius:6px; font-weight:600; color:var(--color-text-muted); }
    .segmented button.active { background:#fff; color:var(--color-primary); box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .review-list { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
    .review-row { display:flex; justify-content:space-between; gap:12px; padding:10px; border:1px solid var(--color-border); border-radius:7px; }
    .review-row small { display:block; color:var(--color-text-muted); }

    /* ===== TABLE ===== */
    .contacts-table-wrapper { flex: 1; min-height: 0; overflow: auto; border:1px solid #DCE7E5; border-radius: var(--radius); }
    table.contacts-table { width: 100%; border-collapse: collapse; background: #fff; overflow: hidden; }
    table.contacts-table th, table.contacts-table td {
      padding: 7px 8px; border-bottom: 1px solid var(--color-border); text-align: left; font-size: 12px; vertical-align: middle;
    }
    table.contacts-table th { background: #EFFFFB; color:#315D58; font-size:11px; font-weight:700; position:sticky; top:0; text-transform:uppercase; }
    table.contacts-table tr:hover td { background: #FFF8F5; }
    table.contacts-table tbody tr { cursor: pointer; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; line-height:1.25;
    }
    .row-select { width: 16px; height: 16px; }
    .mini-select { padding: 3px 6px; border-radius: 6px; border: 1px solid var(--color-border); font-size: 12px; background:#fff; color:#20252B; }
    .email-cell { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; }
    .contact-main { font-weight:700; color:var(--color-primary); line-height:1.25; }
    .contact-sub { display:block; color:var(--color-text-muted); font-size:10px; line-height:1.3; margin-top:2px; max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .org-main { color:var(--color-primary); font-weight:600; }
    .quality-cell { white-space:nowrap; }
    .quality-cell .badge + .badge { margin-left:4px; }
    .table-status { min-width:132px; max-width:155px; }
    .table-send-state { min-width:92px; white-space:nowrap; }
    .table-action { width:42px; text-align:right !important; }
    .contacts-table .mini-select { width:100%; max-width:150px; font-size:11px; padding:4px 5px; }

    /* ===== TEMPLATES ===== */
    .templates-grid { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
    .template-list { display: flex; flex-direction: column; gap: 6px; }
    .template-item {
      padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 8px; background: #fff;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .template-item.active { border-color: var(--color-primary); background: #EEF2FF; }
    .template-editor { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius); padding: 16px; }
    .field-label { font-weight: 700; font-size: 12px; color: var(--color-text-muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
    .field-label:first-child { margin-top: 0; }
    .template-editor input[type="text"], .template-editor textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 8px;
    }
    .template-editor textarea { min-height: 220px; resize: vertical; font-family: inherit; }
    .variables-hint { font-size: 12px; color: var(--color-text-muted); margin-top: 6px; }
    .variables-hint code { background: #F3F4F8; padding: 1px 5px; border-radius: 4px; }

    /* ===== SETTINGS ===== */
    .settings-form { max-width: 640px; background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius); padding: 20px; }
    .settings-form .field-label { margin-top: 16px; }
    .settings-form input[type="text"], .settings-form input[type="number"] { width: 100%; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 8px; }
    .hint { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }

    /* ===== TOAST ===== */
    #toast-container { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
    .toast {
      padding: 10px 14px; border-radius: 8px; color: #fff; font-weight: 600; font-size: 13px;
      box-shadow: 0 4px 14px rgba(0,0,0,.15); max-width: 360px;
    }
    .toast-success { background: var(--color-green); }
    .toast-error { background: var(--color-red); }
    .toast-info { background: var(--color-primary); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(20,20,30,.5); display: flex;
      align-items: center; justify-content: center; z-index: 500; padding: 24px;
    }
    .modal {
      background: #fff; border-radius: 8px; width: 100%; max-width: 560px; max-height: 88vh;
      display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(20,20,40,.25);
    }
    .modal-wide { max-width: 760px; }
    .modal-header {
      padding: 20px 26px; border-bottom: 1px solid var(--color-border);
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .modal-close { border: none; background: none; font-size: 20px; color: var(--color-text-muted); line-height: 1; }
    .modal-body { padding: 22px 26px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 16px 26px; border-top: 1px solid var(--color-border);
      display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field-full { grid-column: 1 / -1; }
    .form-field label {
      font-size: 11px; font-weight: 700; color: var(--color-text-muted);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .form-field input[type="text"], .form-field input[type="email"], .form-field input[type="date"], .form-field input[type="number"], .form-field select, .form-field textarea {
      width: 100%; padding: 9px 11px; border: 1px solid var(--color-border); border-radius: 9px; font-size: 14px; font-family: inherit;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline:none; border-color:#18A98B; box-shadow:0 0 0 3px rgba(63,234,197,.22); }
    .form-field textarea { resize: vertical; }
    .readonly-field { padding: 9px 11px; background: #F3F4F8; border-radius: 9px; font-size: 13px; color: var(--color-text-muted); word-break: break-all; }
    .form-section-title {
      grid-column: 1 / -1; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em;
      color: var(--color-primary); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--color-border);
    }
    .form-section-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }

    .contact-modal { max-width: 820px; }
    .contact-heading { display:flex; align-items:center; gap:12px; min-width:0; }
    .contact-avatar { width:42px; height:42px; display:grid; place-items:center; flex-shrink:0; border-radius:8px; background:#E7F8F7; color:var(--color-brand-ink); font-size:15px; font-weight:800; }
    .contact-heading h2 { line-height:1.2; }
    .contact-heading p { color:var(--color-text-muted); font-size:12px; margin-top:3px; }
    .contact-status-banner { grid-column:1/-1; display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:8px; border-left:4px solid; }
    .contact-status-banner svg { width:19px; height:19px; flex-shrink:0; margin-top:1px; }
    .contact-status-banner strong { display:block; margin-bottom:2px; }
    .status-ready, .status-sent { background:#EAF8F5; border-color:var(--color-brand-teal); color:#116860; }
    .status-warning { background:#FFF5E8; border-color:var(--color-orange); color:#7A4A09; }
    .status-error { background:#FFF0EC; border-color:var(--color-brand-coral); color:#94351F; }
    .check-panel { grid-column:1/-1; background:#F8FAFB; border:1px solid var(--color-border); border-radius:8px; padding:14px; }
    .check-panel-title { display:flex; align-items:center; gap:7px; color:var(--color-brand-ink); font-weight:800; margin-bottom:10px; }
    .check-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .check-item { display:flex; align-items:flex-start; gap:8px; padding:9px 10px; border-radius:7px; background:#fff; border:1px solid var(--color-border); font-size:12px; }
    .check-item svg { width:16px; height:16px; flex-shrink:0; margin-top:1px; }
    .check-ok { color:#137B70; border-color:#BCE5DF; }
    .check-bad { color:#A33A25; border-color:#F4C4B9; background:#FFF8F6; }
    .contact-section { grid-column:1/-1; display:flex; align-items:center; gap:8px; margin-top:12px; padding:12px 0 6px; border-top:1px solid var(--color-border); color:var(--color-brand-ink); font-size:13px; font-weight:800; }
    .contact-section svg { width:18px; height:18px; color:var(--color-brand-teal); }
    .new-contact-modal { border-top:4px solid var(--color-brand-coral); }
    .new-contact-modal .modal-header { background:#FFF8F5; }
    .new-contact-section { margin-top:4px; padding:10px 12px; border-top:0; border-left:4px solid; border-radius:6px; }
    .detail-section { margin-top:8px; padding:10px 12px; border-top:0; border-left:4px solid; border-radius:6px; }
    .identity-section { background:#EEFFFB; border-color:var(--color-brand-teal); }
    .identity-section svg { color:#10987D; }
    .email-section { background:#FFF4F0; border-color:var(--color-brand-coral); }
    .email-section svg { color:#C85E3A; }
    .followup-section { background:#F1F5FA; border-color:#5B7C99; }
    .followup-section svg { color:#456A89; }
    .new-contact-modal .variables-hint { padding:10px 12px; background:#F7F9FA; border-left:3px solid var(--color-brand-teal); border-radius:5px; }
    .contact-important label { color:var(--color-brand-ink); }
    .contact-important input, .contact-important select { border-color:#9FD9D5 !important; box-shadow:inset 3px 0 0 var(--color-brand-teal); }
    .opposition-control { padding:12px 14px; border:1px solid #F4C4B9; background:#FFF8F6; border-radius:8px; }
    .contact-meta { grid-column:1/-1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px; }
    .contact-meta div { padding:9px 10px; border-radius:7px; background:#F3F5F7; color:var(--color-text-muted); font-size:11px; }
    .contact-meta strong { display:block; margin-top:2px; color:var(--color-primary); font-size:12px; }

    .warning-box { background: #FEF3E2; border: 1px solid var(--color-orange); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
    .error-box { background: #FDEDED; border: 1px solid var(--color-red); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
    @media (max-width: 900px) {
      .overview-grid { grid-template-columns:repeat(2,minmax(120px,1fr)); }
      .app-header { align-items:flex-start; }
      .contacts-table-wrapper { min-height:420px; }
    }
    @media (max-width: 620px) {
      .app-header { padding:10px 12px; }
      .app-subtitle { display:none; }
      .tab-panel { padding:12px; }
      .overview-grid { grid-template-columns:1fr 1fr; }
      .form-grid { grid-template-columns:1fr; }
      .form-field-full, .form-section-title { grid-column:1; }
      .check-grid, .contact-meta { grid-template-columns:1fr; }
      .modal-overlay { padding:8px; }
      .toolbar > * { max-width:100%; }
    }
  </style>
</head>
<body>
  <div id="not-in-grist" class="hidden">
    <p>Ce widget doit être ouvert à l'intérieur d'un document Grist.</p>
  </div>

  <div id="main-content">
    <div class="app-header">
      <div class="brand"><img class="brand-logo" src="assets/logo-au-carre.png" alt="Au Carré"><div><h1>Emailing Prospection</h1><div class="app-subtitle">Préparation et suivi des envois</div></div></div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="contacts" onclick="switchTab('contacts')">Contacts</button>
        <button class="tab-btn" data-tab="templates" onclick="switchTab('templates')">Modèles</button>
        <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">Paramètres</button>
      </div>
    </div>

    <div id="tab-contacts" class="tab-panel"></div>
    <div id="tab-templates" class="tab-panel hidden"></div>
    <div id="tab-settings" class="tab-panel hidden"></div>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script src="rules.js"></script>
  <script src="widget.js"></script>
</body>
</html>
